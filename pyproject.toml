[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "debbugs"
version = "0.1.0"
description = "Client for debbugs"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "zeep~=4.3.3",
]

[project.scripts]
debbugs = "debbugs.cli:main"

[project.optional-dependencies]
dev = [
    "pytest~=9.2.0",
    "pytest-icdiff~=0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}
